name: Bug report
description: Report a reproducible problem in repository content or future simulation behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private keys, credentials, sensitive flight data, or unsafe real-world operating details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Provide minimal steps limited to an authorized development or simulation environment.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Branch, tag, or commit identifier if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant non-sensitive operating system and tool versions.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, credentials, personal data, and sensitive flight data.
          required: true
        - label: The reproduction is limited to authorized simulation or development use.
          required: true
