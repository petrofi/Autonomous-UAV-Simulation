name: Feature request
description: Propose a scoped, simulation-first improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What research, simulation, safety, or maintenance need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired outcome without assuming an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Documentation and architecture
        - Simulation
        - Mission management
        - Guidance
        - Safety supervision
        - Perception
        - Security monitoring
        - Telemetry
        - Tooling and tests
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and security considerations
      description: Identify boundary, failure-mode, validation, and misuse considerations.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested simulation validation
      description: Describe how the change could be tested safely in simulation.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request preserves the mandatory safety-supervisor boundary.
          required: true
        - label: This request is intended for civil research and authorized simulation use.
          required: true
